spring.application.name=ledgerline
spring.datasource.url=jdbc:postgresql://localhost:5432/ledgerline_db
spring.datasource.username=ledgerline_app
spring.datasource.password=${DB_PASSWORD}
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.enabled=true
spring.flyway.user=ledgerline_owner
spring.flyway.password=${FLYWAY_PASSWORD}
app.jwt.secret=${JWT_SECRET}
app.jwt.expiry-minutes=60